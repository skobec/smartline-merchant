<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диспутные сообщения — SmartLine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: { 50:'#faf5ff',100:'#f3e8ff',200:'#e9d5ff',300:'#d8b4fe',400:'#c084fc',500:'#a855f7',600:'#9333ea',700:'#7e22ce',800:'#6b21a8',900:'#581c87' }
                    },
                    fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f5f5f7] min-h-screen font-sans">

<include src="/components/header.html"></include>
<include src="components/sidebar.html"></include>

<main class="ml-56">

    <div class="px-6 pt-4 pb-3 flex items-center gap-4">
        <a href="/pages/orders-list.html" class="tab-item inactive">Список</a>
        <a href="/pages/disputes-filters.html" class="tab-item active">Диспутные сообщения</a>
        <a href="#" class="tab-item inactive">Фрод-репорты</a>
        <div class="flex-1"></div>
        <include src="components/search-bar.html"></include>
    </div>

    <div class="px-6 pb-8">
        <div class="bg-white rounded-2xl shadow-sm border border-yellow-100 p-5">

            <div class="flex flex-wrap gap-4">

                <!-- Основные -->
                <div class="filter-card w-52">
                    <h4 class="text-sm font-semibold text-gray-900 mb-3">Основные</h4>
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs text-gray-600 mb-1 block">ID операции</label>
                            <input type="text" class="input-field" placeholder="">
                        </div>
                        <div>
                            <label class="text-xs text-gray-600 mb-1 block">Reason Code</label>
                            <input type="text" class="input-field" placeholder="">
                        </div>
                        <div>
                            <label class="text-xs text-gray-600 mb-1 block">RRN</label>
                            <input type="text" class="input-field" placeholder="">
                        </div>
                        <div>
                            <label class="text-xs text-gray-600 mb-1 block">ARN</label>
                            <input type="text" class="input-field" placeholder="">
                        </div>
                        <div>
                            <label class="text-xs text-gray-600 mb-1 block">Vrol Financial ID</label>
                            <input type="text" class="input-field" placeholder="">
                        </div>
                        <div>
                            <label class="text-xs text-gray-600 mb-1 block">Reference Number</label>
                            <input type="text" class="input-field" placeholder="">
                        </div>
                        <div>
                            <label class="text-xs text-gray-600 mb-1 block">Комментарий</label>
                            <input type="text" class="input-field" placeholder="">
                        </div>
                        <div>
                            <label class="text-xs text-gray-600 mb-1 block">Settlement Currency</label>
                            <select class="input-field"><option>Выберите значения</option></select>
                        </div>
                    </div>
                </div>

                <!-- Сумма / Даты -->
                <div class="filter-card w-48">
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs text-gray-600 mb-1 block">Сумма</label>
                            <div class="flex items-center gap-2">
                                <input type="text" class="input-field text-center" placeholder="от">
                                <span class="text-gray-400 text-xs">—</span>
                                <input type="text" class="input-field text-center" placeholder="до">
                            </div>
                        </div>
                        <div>
                            <label class="text-xs text-gray-600 mb-1 block">Дата транзакции</label>
                            <div class="flex items-center gap-2">
                                <input type="text" value="20.12.2026" class="input-field text-center text-xs">
                                <span class="text-gray-400 text-xs">—</span>
                                <input type="text" value="21.12.2026" class="input-field text-center text-xs">
                            </div>
                        </div>
                        <div>
                            <label class="text-xs text-gray-600 mb-1 block">Дата проведения</label>
                            <div class="flex items-center gap-2">
                                <input type="text" value="20.12.2026" class="input-field text-center text-xs">
                                <span class="text-gray-400 text-xs">—</span>
                                <input type="text" value="21.12.2026" class="input-field text-center text-xs">
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="flex items-center justify-end gap-3 mt-5 pt-4 border-t border-gray-100">
                <button class="btn-secondary">Сбросить фильтры</button>
                <button class="btn-primary">Применить</button>
            </div>
        </div>
    </div>
</main>

</body>
</html>
