<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - SmartLine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Кастомные стили -->
    <link rel="stylesheet" href="/src/css/style.css">
    <!-- Конфиг Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            200: '#e9d5ff',
                            300: '#d8b4fe',
                            400: '#c084fc',
                            500: '#a855f7',
                            600: '#9333ea',
                            700: '#7e22ce',
                            800: '#6b21a8',
                            900: '#581c87',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50">
<div class="w-full max-w-md px-4">
    <!-- Logo -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center">
            <span class="text-5xl font-bold text-purple-800">SI</span>
            <span class="text-2xl text-gray-700 ml-1">SmartLine</span>
        </div>
    </div>

    <!-- Login Form -->
    <div class="bg-white rounded-2xl shadow-lg border border-yellow-100 p-8">

        <!-- Login Field -->
        <div class="mb-5">
            <label class="flex items-center text-gray-700 mb-2 font-medium">
                <svg class="w-5 h-5 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                Логин
            </label>
            <input type="text"
                   class="w-full px-4 py-3 border border-pink-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                   placeholder="Введите логин">
            <p class="text-red-500 text-sm mt-1">*Введите логин</p>
        </div>

        <!-- Password Field -->
        <div class="mb-6">
            <label class="flex items-center text-gray-700 mb-2 font-medium">
                <svg class="w-5 h-5 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                Пароль
            </label>
            <input type="password"
                   class="w-full px-4 py-3 border border-pink-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition"
                   placeholder="Введите пароль">
            <p class="text-red-500 text-sm mt-1">*Введите пароль</p>
        </div>

        <!-- Submit Button -->
        <button type="submit"
                class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 px-6 rounded-lg transition duration-200 flex items-center justify-center gap-2">
            <span>Войти</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
            </svg>
        </button>
    </div>
</div>
</body>
</html>
