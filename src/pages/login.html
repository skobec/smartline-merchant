<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — SmartLine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center font-sans login__bg">

<div class="w-full max-w-[360px] px-4">
    <!-- Logo -->
    <img src="../image/logo.svg" alt="logo" class="mb-10 mx-auto">

    <div class="bg-white rounded-2xl shadow-lg border border-yellow-100 p-6">

        <div class="mb-4">
            <label class="flex items-center text-gray-700 mb-1.5 text-sm font-medium">
                <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                Логин
            </label>
<!--            при валидации менять border-[#E0E0E0] на border-red-300-->
            <input type="text" class="w-full px-3 py-2.5 border border-[#E0E0E0] rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-400 focus:border-transparent bg-white" placeholder="">
<!--            тут месседж валидации -->
            <p class="text-red-500 text-xs mt-1">*Введите логин</p>
        </div>

        <!-- Password -->
        <div class="mb-5">
            <label class="flex items-center text-gray-700 mb-1.5 text-sm font-medium">
                <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
                Пароль
            </label>
            <!--            при валидации менять border-[#E0E0E0] на border-red-300-->
            <input type="password" class="w-full px-3 py-2.5 border border-[#E0E0E0] rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-red-400 focus:border-transparent bg-white" placeholder="">
            <p class="text-red-500 text-xs mt-1">*Введите пароль</p>
        </div>

        <!-- Submit -->
        <button class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-150 flex items-center justify-center gap-2 text-sm">
            <span>Войти</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
            </svg>
        </button>
    </div>
</div>

</body>
</html>
