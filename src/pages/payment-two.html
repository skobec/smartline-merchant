<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>SmartLine - Оплата</title>
    <style>
        body {
            background-image: url("../image/bg.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Gilroy, sans-serif;
        }
    </style>
</head>
<body>
<div class="payment-container-two">
    <!-- Логотип -->
    <div class="mb-6">
        <img src="../image/logo.svg" alt="logo" class="logo-icon max-w-[150px]">
    </div>

    <!-- Сумма -->
    <div class="amount-section">
        <div class="amount-label">Сумма:</div>
        <div class="amount">$ 5,756</div>
    </div>

    <!-- Описание платежа -->
    <div class="description-section">
        <div class="description-label">Описание платежа:</div>
        <div class="description-value">111</div>
    </div>

    <!-- Иконки платежных систем -->
    <div class="payment-methods">
        <img src="../image/payments/mastercard.svg" alt="MasterCard">
        <img src="../image/payments/maestro.svg" alt="Maestro">
        <img src="../image/payments/visa.svg" alt="Visa" class="max-w-11">
    </div>

    <!-- Форма оплаты -->
    <div class="card__form">

        <!-- Номер карты -->
        <div class="form-row">
            <label class="form-label">Номер карты</label>
            <div class="form-input-wrapper">
                <div class="card-number-wrapper">
                    <input type="text" class="form-input card-number !mb-1" placeholder="0000 0000 0000 0000" maxlength="19" autocomplete="off">
                    <div class="card-type-icon"></div>
                </div>
                <span class="input-hint text-[#818181] flex !mt-0">Введите цифры без пробелов</span>

            </div>
        </div>

        <!-- Срок действия -->
        <div class="form-row">
            <label class="form-label">Действительна до</label>
            <div class="expiry-wrapper">
                <select class="expiry-select card-month">
                    <option value="">ММ</option>
                    <option value="01">01</option>
                    <option value="02">02</option>
                    <option value="03">03</option>
                    <option value="04">04</option>
                    <option value="05">05</option>
                    <option value="06">06</option>
                    <option value="07">07</option>
                    <option value="08">08</option>
                    <option value="09">09</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>
                <select class="expiry-select card-year">
                    <option value="">ГГ</option>
                    <option value="25">25</option>
                    <option value="26">26</option>
                    <option value="27">27</option>
                    <option value="28">28</option>
                    <option value="29">29</option>
                    <option value="30">30</option>
                </select>
            </div>
        </div>

        <!-- CVV -->
        <div class="form-row">
            <label class="form-label">CVV</label>
            <div class="form-input-wrapper">
                <div class="cvc-wrapper">
                    <input type="password" class="form-input card-cvc" placeholder="XXX" minlength="3" maxlength="3" autocomplete="off">
                    <button type="button" class="cvc-toggle" id="cvcToggle" aria-label="Показать/скрыть CVV">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display: none;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>
                </div>
                <span class="input-hint text-[#818181] flex !mt-0">Последние три цифры на обороте</span>
            </div>
        </div>

        <!-- Держатель карты -->
        <div class="form-row">
            <label class="form-label">Держатель карты</label>
            <div class="form-input-wrapper">
                <input type="text" class="form-input card-holder !mb-1" placeholder="IVAN IVANOV" />
                <span class="input-hint text-[#818181] flex !mt-0">Последние три цифры на обороте</span>
            </div>
        </div>

    </div>

    <!-- Кнопка оплаты -->
    <button type="submit" class="pay-button">Оплатить</button>

    <!-- Значки безопасности -->
    <div class="security-badges">
        <img src="../image/payments/visa_secure.svg" alt="Visa Secure">
        <img src="../image/payments/mastercard_secure.svg" alt="MasterCard SecureCode">
        <img src="../image/payments/pci_dss.svg" alt="PCI DSS">
    </div>
</div>

<script>
    // ===== ЭЛЕМЕНТЫ УПРАВЛЕНИЯ =====
    const cardNumberInput = document.querySelector('.card-number');
    const cardCvcInput = document.querySelector('.card-cvc');
    const cardHolderInput = document.querySelector('.card-holder');
    const cardMonthSelect = document.querySelector('.card-month');
    const cardYearSelect = document.querySelector('.card-year');
    const cvcToggle = document.getElementById('cvcToggle');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOffIcon = document.getElementById('eyeOffIcon');
    const cardTypeIcon = document.querySelector('.card-type-icon');
    const payButton = document.querySelector('.pay-button');

    // ===== ПЕРЕКЛЮЧЕНИЕ ВИДИМОСТИ CVV =====
    cvcToggle.addEventListener('click', function() {
        if (cardCvcInput.type === 'password') {
            cardCvcInput.type = 'text';
            eyeIcon.style.display = 'none';
            eyeOffIcon.style.display = 'block';
        } else {
            cardCvcInput.type = 'password';
            eyeIcon.style.display = 'block';
            eyeOffIcon.style.display = 'none';
        }
    });

    // ===== ОБРАБОТКА НОМЕРА КАРТЫ =====
    cardNumberInput.addEventListener('input', function(e) {
        // Удаляем все нецифровые символы
        let value = e.target.value.replace(/\D/g, '');
        // Ограничиваем до 16 цифр
        value = value.substring(0, 16);
        // Добавляем пробелы для форматирования
        value = value.replace(/(\d{4})(?=\d)/g, '$1 ');
        e.target.value = value;

        // Определяем тип карты
        detectCardType(value.replace(/\s/g, ''));
    });

    // Функция определения типа карты
    function detectCardType(number) {
        if (/^4/.test(number)) {
            cardTypeIcon.className = 'card-type-icon visa';
        } else if (/^5[1-5]/.test(number) || /^2(22[1-9]|2[3-9][0-9]|[3-6][0-9]{2}|7[01][0-9]|720)/.test(number)) {
            cardTypeIcon.className = 'card-type-icon mastercard';
        } else if (/^5[06-9]/.test(number) || /^6[0-9]/.test(number)) {
            cardTypeIcon.className = 'card-type-icon maestro';
        } else {
            cardTypeIcon.className = 'card-type-icon';
        }
    }

    // ===== CVV: ТОЛЬКО ЦИФРЫ =====
    cardCvcInput.addEventListener('input', function(e) {
        e.target.value = e.target.value.replace(/\D/g, '');
    });

    // ===== ДЕРЖАТЕЛЬ КАРТЫ: ТОЛЬКО БУКВЫ =====
    cardHolderInput.addEventListener('input', function(e) {
        e.target.value = e.target.value.replace(/[^a-zA-Z\s-]/g, '').toUpperCase();
    });

    // ===== ВАЛИДАЦИЯ И ОТПРАВКА =====
    payButton.addEventListener('click', function() {
        const cardNumber = cardNumberInput.value.replace(/\s/g, '');
        const cvc = cardCvcInput.value;
        const month = cardMonthSelect.value;
        const year = cardYearSelect.value;

        let isValid = true;
        let errorMessage = '';

        // Проверка номера карты
        if (cardNumber.length !== 16) {
            cardNumberInput.style.borderColor = '#e17055';
            isValid = false;
            errorMessage = 'Введите корректный номер карты';
        } else {
            cardNumberInput.style.borderColor = '';
        }

        // Проверка CVV
        if (cvc.length !== 3) {
            cardCvcInput.style.borderColor = '#e17055';
            isValid = false;
            errorMessage = errorMessage || 'Введите CVV код (3 цифры)';
        } else {
            cardCvcInput.style.borderColor = '';
        }

        // Проверка срока действия
        if (!month || !year) {
            if (!month) cardMonthSelect.style.borderColor = '#e17055';
            if (!year) cardYearSelect.style.borderColor = '#e17055';
            isValid = false;
            errorMessage = errorMessage || 'Выберите срок действия карты';
        } else {
            cardMonthSelect.style.borderColor = '';
            cardYearSelect.style.borderColor = '';
        }

        if (isValid) {
            alert('Платеж успешно обработан!\n\nНомер карты: **** **** **** ' + cardNumber.slice(-4));
            // Здесь будет отправка на сервер
        } else {
            alert('Ошибка: ' + errorMessage);
        }
    });
</script>
</body>
</html>
